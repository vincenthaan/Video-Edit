[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autocut"
version = "0.1.0"
description = "무음·버벅임 구간 자동 컷 편집 + 자막(SRT) 자동 생성 → CapCut으로 바로 가져가기"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.1",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
autocut = "autocut.cli:main"

[tool.setuptools]
packages = ["autocut"]
